<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Moura | Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Carlos Moura</h1>
        <p>Desenvolvedor Full Stack | Focado em Soluções Modernas</p>
        <nav>
            <a href="#sobre">Sobre</a>
            <a href="#projetos">Projetos</a>
            <a href="mailto:seuemail@gmail.com">Contato</a>
        </nav>
    </header>

    <section id="sobre">
        <h2>Sobre Mim</h2>
        <p>Olá! Sou o Carlos. Especialista em transformar ideias em código...</p>
    </section>

    <section id="projetos">
        <h2>Meus Projetos (Atualizados via GitHub)</h2>
        <div id="repo-list" class="grid-projetos">
            <p>Carregando projetos incríveis...</p>
        </div>
    </section>

    <script>
        const username = 'DevCarlosMoura';
        const repoContainer = document.getElementById('repo-list');

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                const repos = await response.json();

                repoContainer.innerHTML = ''; // Limpa o "Carregando"

                repos.forEach(repo => {
                    // Filtro opcional: Só mostra repositórios que não são forks
                    if (!repo.fork) {
                        const card = `
                            <div class="card">
                                <h3>${repo.name}</h3>
                                <p>${repo.description || "Sem descrição disponível."}</p>
                                <span>Linguagem: ${repo.language || "Mista"}</span>
                                <br>
                                <a href="${repo.html_url}" target="_blank">Ver Repositório</a>
                            </div>
                        `;
                        repoContainer.innerHTML += card;
                    }
                });
            } catch (error) {
                repoContainer.innerHTML = '<p>Erro ao carregar projetos. Visite meu GitHub direto!</p>';
            }
        }

        fetchRepos();
    </script>
</body>
</html>
